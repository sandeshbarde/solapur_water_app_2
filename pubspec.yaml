name: solapur_water_app
description: Solapur Water Management Application
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  intl: ^0.20.2
  provider: ^6.1.1
  google_fonts: ^6.1.0
  shared_preferences: ^2.2.2
  image_picker: ^1.0.4
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  fl_chart: ^0.66.0
  font_awesome_flutter: ^10.7.0
  url_launcher: ^6.2.2
  flutter_secure_storage: ^9.2.2

  # ADD THIS FOR API CALLS
  http: ^1.2.1
  model_viewer_plus: ^1.10.0
  flutter_dotenv: ^6.0.1
  file_picker: ^11.0.3
  permission_handler: ^13.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/models/